<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Torre de Guaita</title>

<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #cfe0b8;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    box-sizing: border-box;
    text-align: center;
  }

  .logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 1.3em;
    margin: 0 0 22px;
    color: #1a1a1a;
  }

  iframe {
    width: 100%;
    max-width: 480px;
    height: 130px;
    border: none;
    background: #cfe0b8;
    margin-bottom: 26px;
  }

  /* TAULES DELS BOTONS */
  .botons {
    width: 100%;
    max-width: 900px;
    border-collapse: collapse;
    background: transparent;
    border: 0;
    margin: 0 auto 22px;
  }

  .botons td {
    width: 33.33%;
    text-align: center;
    vertical-align: middle;
    background: transparent;
    border: 0;
    padding: 0;
  }

  .botons a {
    display: block;
    text-decoration: none;
    line-height: 0;
  }

  .botons img {
    display: block;
    box-shadow: none;
    border: 0;
    width: 85%;
    max-width: 350px;
    height: auto;
    margin: 0 auto;
  }

  /* MÒBIL */
  @media (max-width: 600px) {
    .botons img {
      width: 90%;
    }
  }
</style>
</head>

<body>

  <!-- LOGOTIP -->
  <img
    class="logo"
    src="logo.png"
    alt="La Torre de Guaita"
  >

  <!-- TÍTOL -->
  <h1 id="titol">🔊 Escolta l'àudio</h1>

  <!-- REPRODUCTOR -->
  <iframe
    id="f"
    scrolling="no"
    title="Reproductor d'àudio">
  </iframe>


  <!-- =====================================================
       XARXES PER REBRE INFORMACIÓ
       ===================================================== -->

  <table class="botons">
    <tbody>
      <tr>

        <!-- X -->
        <td>
          <a
            href="https://x.com/laTdeG"
            target="_blank"
            rel="noopener"
            title="X per rebre informació"
          >
            <img
              src="twitter_t.png"
              alt="X @latdeg"
            >
          </a>
        </td>

        <!-- WHATSAPP CANAL -->
        <td>
          <a
            href="https://wa.me/channel/0029Vb7eGZSJZg4G6UhXkE2u"
            target="_blank"
            rel="noopener"
            title="Canal de WhatsApp"
          >
            <img
              src="whatscanal_t.png"
              alt="Canal de WhatsApp"
            >
          </a>
        </td>

        <!-- TELEGRAM CANAL -->
        <td>
          <a
            href="https://t.me/laTdG_podcast"
            target="_blank"
            rel="noopener"
            title="Canal de Telegram"
          >
            <img
              src="telcanal_t.png"
              alt="Canal de Telegram"
            >
          </a>
        </td>

      </tr>
    </tbody>
  </table>


  <!-- =====================================================
       CONTACTE
       ===================================================== -->

  <table class="botons">
    <tbody>
      <tr>

        <!-- CORREU -->
        <td>
          <a
            href="mailto:latdg@laguait.cat"
            title="Correu electrònic"
          >
            <img
              src="correu_t.png"
              alt="Correu electrònic"
            >
          </a>
        </td>

        <!-- TELEGRAM CONTACTE -->
        <td>
          <a
            href="https://t.me/laTdG_contacte"
            target="_blank"
            rel="noopener"
            title="Contacte per Telegram"
          >
            <img
              src="telcontacte_t.png"
              alt="Telegram contacte"
            >
          </a>
        </td>

        <!-- WHATSAPP BUSINESS -->
        <td>
          <a
            href="https://wa.me/632042734"
            target="_blank"
            rel="noopener"
            title="WhatsApp Business"
          >
            <img
              src="whatscontacte_t.png"
              alt="WhatsApp Business"
            >
          </a>
        </td>

      </tr>
    </tbody>
  </table>


  <!-- =====================================================
       PÒDCAST
       ===================================================== -->

  <table class="botons">
    <tbody>
      <tr>

        <td></td>

        <td>
          <a
            href="https://laguait.cat/latdg"
            target="_blank"
            rel="noopener"
            title="La TdG Pòdcast"
          >
            <img
              src="latdg_t.png"
              alt="La TdG Pòdcast"
            >
          </a>
        </td>

        <td></td>

      </tr>
    </tbody>
  </table>


<script>

  /* RECUPERACIÓ DE L'ÀUDIO */

  var p = new URLSearchParams(location.search);

  var s = p.get('src');

  if (s) {
    document.getElementById('f').src = s;
  }


  /* TÍTOL DINÀMIC */

  var titol = p.get('titol');

  if (titol) {
    document.getElementById('titol').textContent =
      '🗣️ Declaracions de ' + titol;
  }

</script>

</body>
</html>
