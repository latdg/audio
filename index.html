<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Torre de Guaita</title>

<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #cfe0b8;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    box-sizing: border-box;
    text-align: center;
  }

  .logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 1.3em;
    margin: 0 0 22px;
    color: #1a1a1a;
  }

  iframe {
    width: 100%;
    max-width: 480px;
    height: 130px;
    border: none;
    background: #cfe0b8;
    margin-bottom: 26px;
  }

  /* BOTONS */
  .xarxes {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .xarxes a {
    display: block;
    width: 100%;
    text-decoration: none;
    line-height: 0;
  }

  .xarxes img {
    display: block;
    width: 100%;
    height: auto;
    border: 0;
  }

  /* Adaptació per a pantalles petites */
  @media (max-width: 520px) {
    html, body {
      padding-left: 10px;
      padding-right: 10px;
    }

    .xarxes {
      max-width: 100%;
      gap: 10px;
    }
  }
</style>
</head>

<body>

  <!-- LOGOTIP DE LA TORRE DE GUAITA -->
  <img
    class="logo"
    src="logo.png"
    alt="La Torre de Guaita"
  >

  <h1 id="titol">🔊 Escolta l'àudio</h1>

  <iframe
    id="f"
    scrolling="no"
  ></iframe>


  <!-- =========================================
       SET BOTONS / IMATGES
       ========================================= -->

  <div class="xarxes">

    <!-- 1. X / TWITTER -->
    <a
      href="https://x.com/laTdeG"
      title="X de La Torre de Guaita"
    >
      <img
        src="twitter_t.png"
        alt="X — @latdeg"
      >
    </a>


    <!-- 2. WHATSAPP BUSINESS -->
    <a
      href="https://wa.me/632042734"
      title="WhatsApp Business de La Torre de Guaita"
    >
      <img
        src="whatscontacte_t.png"
        alt="WhatsApp Business — 632 042 734"
      >
    </a>


    <!-- 3. CANAL DE WHATSAPP -->
    <a
      href="https://wa.me/channel/0029Vb7eGZSJZg4G6UhXkE2u"
      title="Canal de WhatsApp de La Torre de Guaita"
    >
      <img
        src="whatscanal_t.png"
        alt="WhatsApp — Canal"
      >
    </a>


    <!-- 4. CONTACTE DE TELEGRAM -->
    <a
      href="https://t.me/laTdG_contacte"
      title="Contacte de La Torre de Guaita per Telegram"
    >
      <img
        src="telcontacte_t(2).png"
        alt="Telegram — Contacte"
      >
    </a>


    <!-- 5. CANAL DE TELEGRAM -->
    <a
      href="https://t.me/laTdG_podcast"
      title="Canal de Telegram de La Torre de Guaita"
    >
      <img
        src="telcanal_t.png"
        alt="Telegram — Canal"
      >
    </a>


    <!-- 6. CORREU ELECTRÒNIC -->
    <a
      href="mailto:latdg@laguait.cat"
      title="Enviar un correu electrònic a La Torre de Guaita"
    >
      <img
        src="correu_t.png"
        alt="Correu electrònic — latdg@laguait.cat"
      >
    </a>


    <!-- 7. LA TdG PÒDCAST -->
    <a
      href="https://t.me/laTdG_podcast"
      title="La TdG Pòdcast"
    >
      <img
        src="latdg_t.png"
        alt="La TdG Pòdcast"
      >
    </a>

  </div>


<script>

  /* =========================================
     ÀUDIO
     ========================================= */

  var p = new URLSearchParams(location.search);

  var s = p.get('src');

  if (s) {
    document.getElementById('f').src = s;
  }


  /* =========================================
     TÍTOL
     ========================================= */

  var titol = p.get('titol');

  if (titol) {
    document.getElementById('titol').textContent =
      '🗣️ Declaracions de ' + titol;
  }

</script>

</body>
</html>
