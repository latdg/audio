    text-align: center;

  h1 {

    color: #1a1a1a;
  }
iframe {

  max-width: 960px;
  height: 380px;
  border: none;
  background: #cfe0b8;
  margin-bottom: 26px;
  transition: height 0.15s ease;
}
  /* TAULES DELS BOTONS */
  .taula-botons {
    width: 100%;
    max-width: 1050px;
    border-collapse: collapse;
    border: 0 !important;
    margin: 0 auto 20px;
    background: transparent !important;
  }
  .taula-botons td {
    width: 33.33%;
    text-align: center;
    vertical-align: middle;
    border: 0 !important;
    padding: 0;
    background: transparent !important;
  }
  .taula-botons a {
    display: block;
    text-decoration: none;
    line-height: 0;
  }
  /* MIDA DE LES ICONES */
  .taula-botons img {
    display: block;
    width: auto;
    height: 50px;
    margin: 0 auto;
    border: 0 !important;
    box-shadow: none !important;
  }
  /* ESPAI ENTRE FILES */
  .fila-separacio td {
    height: 18px;
  }
  /* MÒBIL */
  @media (max-width: 600px) {
    body {
      padding-left: 8px;
      padding-right: 8px;
    }
    .taula-botons img {
      height: 44px;
    }
  }
</style>

<script>

  /* =====================================================
     RECUPERAR L'ÀUDIO
     ===================================================== */

  var p = new URLSearchParams(location.search);

  var s = p.get('src');

  if (s) {
    document.getElementById('f').src = s;
  }


  /* =====================================================
     TÍTOL DINÀMIC
     ===================================================== */

  var titol = p.get('titol');

  if (titol) {
    document.getElementById('titol').textContent =
      '🗣️ Declaracions de ' + titol;
  } else {

    // Si no hi ha un únic declarant (cas de diverses declaracions),
    // el paràmetre "n" (nombre de fitxers) ens diu si cal parlar en
    // plural o en singular.
    var n = parseInt(p.get('n'), 10);

    if (n && n > 1) {
      document.getElementById('titol').textContent =
        '🔊 Escolta els àudios';
    }
    // Si n és 1 (o no hi ha paràmetre n), es manté el text per defecte
    // de l'HTML: "🔊 Escolta l'àudio".
  }


  /* =====================================================
     ALÇADA DINÀMICA DE L'IFRAME
     -----------------------------------------------------
     La pàgina d'àudio (dins de l'iframe) ens envia la seva
     alçada real via postMessage un cop carregada. Així
     l'iframe s'ajusta sol tant si hi ha 1 declaració com
     si n'hi ha 5, sense haver de tocar mai aquest fitxer.
     ===================================================== */

  window.addEventListener('message', function(event) {
    if (
      event.data &&
      event.data.tipus === 'latdg-alcada' &&
      typeof event.data.alcada === 'number'
    ) {
      document.getElementById('f').style.height = event.data.alcada + 'px';
    }
  });

</script>
