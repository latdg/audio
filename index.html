<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Torre de Guaita</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #cfe0b8; /* mateix verd que jo.cat/latdg */
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    box-sizing: border-box;
    text-align: center;
  }
  .logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 1.3em;
    margin: 0 0 22px;
    color: #1a1a1a;
  }
  iframe {
    width: 100%;
    max-width: 480px;
    height: 130px;
    border: none;
    background: #cfe0b8;
    margin-bottom: 26px;
  }
  .xarxes {
    display: flex;
    gap: 18px;
  }
  .xarxes a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #7c1d1d;
    text-decoration: none;
  }
  .xarxes img, .xarxes svg { width: 22px; height: 22px; }
</style>
</head>
<body>

  <!-- Puja el fitxer del logotip a aquest mateix repositori (per
       exemple logo.png) i deixa aquest nom tal qual, o canvia'l pel
       nom real del fitxer que hagis pujat. -->
  <img class="logo" src="logo.png" alt="La Torre de Guaita">

  <h1 id="titol">🔊 Escolta l'àudio</h1>

  <iframe id="f" scrolling="no"></iframe>

  <!-- Substitueix cada href pel destí real. -->
  <div class="xarxes">
    <a href="https://x.com/laTdeG" title="X">
      <img src="https://cdn.simpleicons.org/x/ffffff" alt="X">
    </a>
    <a href="https://https://wa.me/632042734" title="Grup de WhatsApp Business">
      <img src="https://cdn.simpleicons.org/whatsapp/ffffff" alt="WhatsApp Business">
    </a>
    <a href="https://wa.me/channel/0029Vb7eGZSJZg4G6UhXkE2u" title="Canal de WhatsApp">
      <img src="https://cdn.simpleicons.org/whatsapp/ffffff" alt="WhatsApp">
    </a>
	<a href="https://t.me/laTdG_contacte" title="Grup de Telegram">
      <img src="https://cdn.simpleicons.org/telegram/ffffff" alt="Telegram">
    </a>
	<a href="https://t.me/laTdG_podcast" title="Canal de Telegram">
      <img src="https://cdn.simpleicons.org/telegram/ffffff" alt="Telegram">
    </a>
    <a href="https://laguait.cat/latdg" title="Torna al pòdcast">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
    </a>
  </div>
	
<script>
  var p = new URLSearchParams(location.search);
  var s = p.get('src');
  if (s) { document.getElementById('f').src = s; }

  var titol = p.get('titol');
  if (titol) {
    document.getElementById('titol').textContent = '🗣️ Declaracions de ' + titol;
  }
</script>

</body>
</html>
