<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Torre de Guaita</title>

<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #cfe0b8;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    box-sizing: border-box;
    text-align: center;
  }

  .logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 1.3em;
    margin: 0 0 22px;
    color: #1a1a1a;
  }

  iframe {
    width: 100%;
    max-width: 480px;
    height: 130px;
    border: none;
    background: #cfe0b8;
    margin-bottom: 26px;
  }

  /* BOTONS */
  .xarxes {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .xarxes a {
    display: block;
    width: 100%;
    max-width: 700px;
    text-decoration: none;
    line-height: 0;
  }

  .xarxes img {
    display: block;
    width: 100%;
    height: auto;
    border: 0;
  }

  /* Adaptació per a mòbil */
  @media (max-width: 600px) {
    html, body {
      padding: 20px 10px 30px;
    }

    .logo {
      width: 95px;
      height: 95px;
    }

    h1 {
      font-size: 1.15em;
      margin-bottom: 18px;
    }

    .xarxes {
      max-width: 100%;
      gap: 10px;
    }

    .xarxes a {
      max-width: 100%;
    }
  }
</style>
</head>

<body>

  <!-- LOGOTIP -->
  <img
    class="logo"
    src="logo.png"
    alt="La Torre de Guaita"
  >

  <!-- TÍTOL -->
  <h1 id="titol">🔊 Escolta l'àudio</h1>

  <!-- ÀUDIO -->
  <iframe
    id="f"
    scrolling="no">
  </iframe>

  <!-- BOTONS -->
  <div class="xarxes">

    <!-- X -->
    <a
      href="https://x.com/laTdeG"
      title="X — @latdeg"
      target="_blank"
      rel="noopener">
      <img
        src="twitter_t.png"
        alt="X — @latdeg">
    </a>

    <!-- WHATSAPP BUSINESS -->
    <a
      href="https://wa.me/632042734"
      title="WhatsApp Business — 632 042 734"
      target="_blank"
      rel="noopener">
      <img
        src="whatscontacte_t.png"
        alt="WhatsApp Business — 632 042 734">
    </a>

    <!-- WHATSAPP CANAL -->
    <a
      href="https://wa.me/channel/0029Vb7eGZSJZg4G6UhXkE2u"
      title="WhatsApp — Canal"
      target="_blank"
      rel="noopener">
      <img
        src="whatscanal_t.png"
        alt="WhatsApp — Canal">
    </a>

    <!-- TELEGRAM CONTACTE -->
    <a
      href="https://t.me/laTdG_contacte"
      title="Telegram — Contacte"
      target="_blank"
      rel="noopener">
      <img
        src="telcontacte_t.png"
        alt="Telegram — Contacte">
    </a>

    <!-- TELEGRAM CANAL -->
    <a
      href="https://t.me/laTdG_podcast"
      title="Telegram — Canal"
      target="_blank"
      rel="noopener">
      <img
        src="telcanal_t.png"
        alt="Telegram — Canal">
    </a>

    <!-- CORREU ELECTRÒNIC -->
    <a
      href="mailto:latdg@laguait.cat"
      title="Correu electrònic — latdg@laguait.cat">
      <img
        src="correu_t.png"
        alt="Correu electrònic — latdg@laguait.cat">
    </a>

    <!-- PÒDCAST -->
    <a
      href="https://laguait.cat/latdg"
      title="La TdG Pòdcast"
      target="_blank"
      rel="noopener">
      <img
        src="latdg_t.png"
        alt="La TdG Pòdcast">
    </a>

  </div>


<script>
  var p = new URLSearchParams(location.search);

  /* ÀUDIO */
  var s = p.get('src');

  if (s) {
    document.getElementById('f').src = s;
  }

  /* TÍTOL */
  var titol = p.get('titol');

  if (titol) {
    document.getElementById('titol').textContent =
      '🗣️ Declaracions de ' + titol;
  }
</script>

</body>
</html>
