<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Torre de Guaita</title>

<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #cfe0b8;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    box-sizing: border-box;
    text-align: center;
  }

  .logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 1.3em;
    margin: 0 0 22px;
    color: #1a1a1a;
  }

  iframe {
    width: 100%;
    max-width: 480px;
    height: 130px;
    border: none;
    background: #cfe0b8;
    margin-bottom: 26px;
  }

  /* CONTENIDOR DELS SET BOTONS */
  .xarxes {
    width: 100%;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* CADA BOTÓ ÉS UNA IMATGE */
  .xarxes a {
    display: block;
    width: 100%;
    text-decoration: none;
    line-height: 0;
  }

  /* IMATGES AL 10% DE LA MIDA DISPONIBLE */
  .xarxes img {
    display: block;
    width: 10%;
    height: auto;
    margin: 0 auto;
    object-fit: contain;
  }

  /* En pantalles petites, una mica més grans per facilitar el clic */
  @media (max-width: 600px) {
    .xarxes img {
      width: 80%;
    }
  }
</style>
</head>

<body>

  <!-- LOGOTIP -->
  <img
    class="logo"
    src="logo.png"
    alt="La Torre de Guaita"
  >

  <!-- TÍTOL -->
  <h1 id="titol">🔊 Escolta l'àudio</h1>

  <!-- REPRODUCTOR -->
  <iframe
    id="f"
    scrolling="no"
    title="Reproductor d'àudio"
  ></iframe>

  <!-- SET BOTONS -->

  <div class="xarxes">

    <!-- 1. X / TWITTER -->
    <a
      href="https://x.com/laTdeG"
      title="X per rebre informació"
    >
      <img
        src="audio/twitter_t.png"
        alt="X — @latdeg"
      >
    </a>

    <!-- 2. WHATSAPP BUSINESS -->
    <a
      href="https://wa.me/632042734"
      title="WhatsApp Business per escriure'ns"
    >
      <img
        src="audio/whatscontacte_t.png"
        alt="WhatsApp Business — 632 042 734"
      >
    </a>

    <!-- 3. CANAL DE WHATSAPP -->
    <a
      href="https://wa.me/channel/0029Vb7eGZSJZg4G6UhXkE2u"
      title="Canal de WhatsApp per rebre informació"
    >
      <img
        src="audio/whatscanal_t.png"
        alt="WhatsApp — Canal"
      >
    </a>

    <!-- 4. TELEGRAM CONTACTE -->
    <a
      href="https://t.me/laTdG_contacte"
      title="Telegram per escriure'ns"
    >
      <img
        src="audio/telcontacte_t.png"
        alt="Telegram — Contacte"
      >
    </a>

    <!-- 5. CANAL DE TELEGRAM -->
    <a
      href="https://t.me/laTdG_podcast"
      title="Canal de Telegram per rebre informació"
    >
      <img
        src="audio/telcanal_t.png"
        alt="Telegram — Canal"
      >
    </a>

    <!-- 6. CORREU ELECTRÒNIC -->
    <a
      href="mailto:latdg@laguait.cat"
      title="Envia'ns un correu electrònic"
    >
      <img
        src="audio/correu_t.png"
        alt="Correu electrònic — latdg@laguait.cat"
      >
    </a>

    <!-- 7. PÒDCAST -->
    <a
      href="https://laguait.cat/latdg"
      title="La TdG Pòdcast"
    >
      <img
        src="audio/latdg_t.png"
        alt="La TdG Pòdcast"
      >
    </a>

  </div>


<script>

  /* ÀUDIO */
  var p = new URLSearchParams(location.search);

  var s = p.get('src');

  if (s) {
    document.getElementById('f').src = s;
  }


  /* TÍTOL DINÀMIC */
  var titol = p.get('titol');

  if (titol) {
    document.getElementById('titol').textContent =
      '🗣️ Declaracions de ' + titol;
  }

</script>

</body>
</html>
