<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Torre de Guaita</title>

<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #cfe0b8;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    box-sizing: border-box;
    text-align: center;
  }

  .logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 1.3em;
    margin: 0 0 22px;
    color: #1a1a1a;
  }

  iframe {
    width: 100%;
    max-width: 480px;
    height: 130px;
    border: none;
    background: #cfe0b8;
    margin-bottom: 26px;
  }

  /* TAULES DELS BOTONS */

  .taula-botons {
    width: 100%;
    max-width: 1050px;
    border-collapse: collapse;
    border: 0 !important;
    margin: 0 auto 20px;
    background: transparent !important;
  }

  .taula-botons td {
    width: 33.33%;
    text-align: center;
    vertical-align: middle;
    border: 0 !important;
    padding: 0;
    background: transparent !important;
  }

  .taula-botons a {
    display: block;
    text-decoration: none;
    line-height: 0;
  }

  /* MIDA DE LES IMATGES */

  .taula-botons img {
    display: block;
    width: 70%;
    max-width: 280px;
    height: auto;
    margin: 0 auto;
    border: 0 !important;
    box-shadow: none !important;
  }

  /* ESPAI ENTRE FILES */

  .fila-separacio td {
    height: 18px;
  }

  /* MÒBIL */

  @media (max-width: 600px) {

    body {
      padding-left: 8px;
      padding-right: 8px;
    }

    .taula-botons img {
      width: 90%;
      max-width: 280px;
    }

  }
</style>
</head>

<body>

  <!-- LOGOTIP -->

  <img
    class="logo"
    src="logo.png"
    alt="La Torre de Guaita"
  >

  <!-- TÍTOL -->

  <h1 id="titol">🔊 Escolta l'àudio</h1>

  <!-- REPRODUCTOR -->

  <iframe
    id="f"
    scrolling="no"
    title="Reproductor d'àudio">
  </iframe>


  <!-- =====================================================
       PRIMERA FILA
       X · WHATSAPP CANAL · TELEGRAM CANAL
       ===================================================== -->

  <table class="taula-botons">
    <tbody>

      <tr>

        <!-- X -->

        <td>
          <a
            href="https://x.com/latdeg"
            target="_blank"
            rel="noopener"
            title="X @latdeg"
          >
            <img
              src="https://latdg.github.io/audio/twitter_t.png"
              alt="X @latdeg"
            >
          </a>
        </td>


        <!-- WHATSAPP CANAL -->

        <td>
          <a
            href="https://wa.me/channel/0029Vb7eGZSJZg4G6UhXkE2u"
            target="_blank"
            rel="noopener"
            title="Canal de WhatsApp"
          >
            <img
              src="https://latdg.github.io/audio/whatscanal_t.png"
              alt="Canal de WhatsApp"
            >
          </a>
        </td>


        <!-- TELEGRAM CANAL -->

        <td>
          <a
            href="https://t.me/laTdG_podcast"
            target="_blank"
            rel="noopener"
            title="Canal de Telegram"
          >
            <img
              src="https://latdg.github.io/audio/telcanal_t.png"
              alt="Canal de Telegram"
            >
          </a>
        </td>

      </tr>


      <!-- ESPAI ENTRE FILES -->

      <tr class="fila-separacio">
        <td colspan="3"></td>
      </tr>


      <!-- =================================================
           SEGONA FILA
           CORREU · TELEGRAM CONTACTE · WHATSAPP CONTACTE
           ================================================= -->

      <tr>

        <!-- CORREU -->

        <td>
          <a
            href="mailto:latdg@laguait.cat"
            title="Correu electrònic"
          >
            <img
              src="https://latdg.github.io/audio/correu_t.png"
              alt="Correu electrònic"
            >
          </a>
        </td>


        <!-- TELEGRAM CONTACTE -->

        <td>
          <a
            href="https://t.me/laTdG_contacte"
            target="_blank"
            rel="noopener"
            title="Contacte per Telegram"
          >
            <img
              src="https://latdg.github.io/audio/telcontacte_t.png"
              alt="Telegram contacte"
            >
          </a>
        </td>


        <!-- WHATSAPP BUSINESS -->

        <td>
          <a
            href="https://wa.me/632042734"
            target="_blank"
            rel="noopener"
            title="WhatsApp Business"
          >
            <img
              src="https://latdg.github.io/audio/whatscontacte_t.png"
              alt="WhatsApp Business"
            >
          </a>
        </td>

      </tr>


      <!-- ESPAI ENTRE FILES -->

      <tr class="fila-separacio">
        <td colspan="3"></td>
      </tr>


      <!-- =================================================
           TERCERA FILA
           LA TdG PODCAST
           ================================================= -->

      <tr>

        <td></td>

        <td>
          <a
            href="https://laguait.cat/latdg"
            target="_blank"
            rel="noopener"
            title="La TdG Podcast"
          >
            <img
              src="https://latdg.github.io/audio/latdg_t.png"
              alt="La TdG Podcast"
            >
          </a>
        </td>

        <td></td>

      </tr>

    </tbody>
  </table>


<script>

  /* =====================================================
     RECUPERAR L'ÀUDIO
     ===================================================== */

  var p = new URLSearchParams(location.search);

  var s = p.get('src');

  if (s) {
    document.getElementById('f').src = s;
  }


  /* =====================================================
     TÍTOL DINÀMIC
     ===================================================== */

  var titol = p.get('titol');

  if (titol) {
    document.getElementById('titol').textContent =
      '🗣️ Declaracions de ' + titol;
  }

</script>

</body>
</html>
